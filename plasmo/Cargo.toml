[package]
name = "plasmo"
version = "0.5.0-alpha.2"
authors = ["Jonathan Kelley, Evan Almloff"]
edition = "2021"
description = "TUI-based renderer for Dioxus"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
keywords = ["dom", "ui", "gui", "react", "terminal"]
license = "MIT OR Apache-2.0"

[dependencies]
dioxus-html = { version = "0.7.1", features = ["serialize"] }
dioxus-core-types = "0.7.1"
dioxus-native-core = { path = "../native-core", features = ["layout-attributes"] }
dioxus-native-core-macro = { path = "../native-core-macro" }

ratatui = "0.24.0"
crossterm = "0.26.1"
anyhow = "1.0.42"
tokio = { version = "1.36", features = ["full"] }
futures = "0.3.30"
taffy = "0.3.12"
smallvec = "1.6"
rustc-hash = "1.1.0"
futures-channel = "0.3.30"
shipyard = { version = "0.6.2", features = ["proc", "std"], default-features = false }
once_cell = "1.17.1"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
criterion = "0.3.5"

[features]
default = []
parallel = ["shipyard/parallel"]
