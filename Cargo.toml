[package]
name = "dioxus-tui"
version = "0.7.2"
authors = ["Jonathan Kelley, Evan Almloff"]
edition = "2024"
description = "TUI-based renderer for Dioxus"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started/tui"
keywords = ["dom", "ui", "gui", "react", "terminal"]
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.7.2" }
dioxus-core = { version = "0.7.2", features = ["serialize"] }
dioxus-html = { version = "0.7.2" }
dioxus-core-types = "0.7.2"
keyboard-types = "0.8"
dioxus-hot-reload = { version = "0.6.0-alpha.2", optional = true }
dioxus-native = { git = "https://github.com/JakkuSakura/blitz", branch = "window-manager", optional = true }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-channel = "0.3"
termwiz = "0.23"
unicode-width = "0.2"
anyhow = "1.0.42"
bevy_ecs = { version = "0.18.0-rc.1", default-features = false }
blitz-dom = { git = "https://github.com/JakkuSakura/blitz", branch = "window-manager", default-features = false, features = ["system_fonts"] }
blitz-traits = { git = "https://github.com/JakkuSakura/blitz", branch = "window-manager" }
blitz-paint = { git = "https://github.com/JakkuSakura/blitz", branch = "window-manager", default-features = false, optional = true }
taffy = "0.9.2"
rasteroid = "0.1.8"
dioxus-native-dom = { git = "https://github.com/JakkuSakura/blitz", branch = "window-manager" }
anyrender = "0.6"
anyrender_vello_cpu = { version = "0.8.1", optional = true }
png = "0.18"
base64 = "0.22"
peniko = "0.5"
kurbo = "0.12"
ttf-parser = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi"] }
thiserror = "2"
style = { version = "0.9", package = "stylo" }
smol_str = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dioxus = { version = "0.7.2" }
tokio = { version = "1.36", features = ["full"] }
criterion = "0.8.0"
clap = { version = "4.5", features = ["derive"] }

[[bench]]
name = "update"
harness = false

[features]
default = []
hot-reload = ["dioxus-hot-reload"]
blitz = ["dep:blitz-paint", "dep:anyrender_vello_cpu", "dep:dioxus-native"]

# Backwards-compatible aliases.
blitz-terminal = ["blitz"]
blitz-gui = ["blitz"]
