[package]
name = "dioxus-tui"
version = "0.7.1"
authors = ["Jonathan Kelley, Evan Almloff"]
edition = "2021"
description = "TUI-based renderer for Dioxus"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started/tui"
keywords = ["dom", "ui", "gui", "react", "terminal"]
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.7.1" }
dioxus-core = { version = "0.7.1", features = ["serialize"] }
dioxus-html = { version = "0.7.1" }
dioxus-core-types = "0.7.1"
keyboard-types = "0.8.3"
dioxus-hot-reload = { version = "0.6.0-alpha.2", optional = true }

crossterm = "0.29.0"
tokio = { version = "1.36", features = ["full"] }
futures = "0.3.30"
futures-channel = "0.3.30"
# if possible, use taffy to do layout calculations
taffy = "0.9.2"
ratatui = "0.29.0"
anyhow = "1.0.42"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
criterion = "0.3.5"

[[bench]]
name = "update"
harness = false

[features]
default = []
hot-reload = ["dioxus-hot-reload"]
