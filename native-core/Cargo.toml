[package]
name = "dioxus-native-core"
version = "0.5.0-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
description = "Build natively rendered apps with Dioxus"
keywords = ["dom", "ui", "gui", "react"]
authors = ["Jonathan Kelley", "Evan Almloff"]

[dependencies]
dioxus-core = { version = "0.7.1", optional = true }

keyboard-types = "0.7"
smallvec = "1.6"
rustc-hash = "1.1.0"
anymap3 = "1.0.1"
parking_lot = { version = "0.12.1", features = ["send_guard"] }
dashmap = "5.4.0"

# for parsing attributes
taffy = { version = "0.3.12", optional = true }
lightningcss = { version = "1.0.0-alpha.39", optional = true }

shipyard = { version = "0.6.2", features = ["proc", "std"], default-features = false }

[dev-dependencies]
rand = "0.8.5"
dioxus = { version = "0.7.1" }
tokio = { version = "1.36", features = ["full"] }
dioxus-native-core-macro = { path = "../native-core-macro" }

[features]
default = []
layout-attributes = ["dep:taffy", "dep:lightningcss"]
dioxus = ["dioxus-core"]
parallel = ["shipyard/parallel"]
